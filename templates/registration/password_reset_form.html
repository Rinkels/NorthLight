{% extends "base.html" %}
{% block title %}Reset password · NorthLight{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card border-0 shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Reset your password</h1>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_email">Email</label>
        <input class="form-control" type="email" name="email" id="id_email" required></div>
      <button class="btn btn-primary w-100" type="submit">Send reset link</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
