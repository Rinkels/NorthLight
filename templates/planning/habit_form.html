{% extends "base.html" %}
{% block title %}Habit · NorthLight{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="h4 mb-3">{% if habit %}Edit habit{% else %}New habit{% endif %}</h1>
  <div class="nl-card p-4"><form method="post" novalidate>{% csrf_token %}{% include "planning/_form.html" %}
    <div class="d-flex gap-2"><button class="btn btn-primary">Save</button><a class="btn btn-link" href="{% url 'planning:habit_list' %}">Cancel</a>
      {% if habit %}<button class="btn btn-link text-danger ms-auto" formaction="{% url 'planning:habit_delete' habit.pk %}" onclick="return confirm('Delete this habit and its check-ins?')">Delete</button>{% endif %}</div></form></div>
</div></div>
{% endblock %}
